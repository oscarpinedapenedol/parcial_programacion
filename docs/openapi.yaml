openapi: 3.0.3
info:
  title: TiendaAPI
  version: 1.0.0
  description: API de la tienda en línea del curso INF 323
servers:
  - url: http://localhost:3000
tags:
  - name: Salud
  - name: Productos
  - name: Pedidos
paths:
  /api/salud:
    get:
      tags: [Salud]
      summary: Comprobar conexión con la base de datos
      responses:
        '200':
          description: API y base de datos disponibles
  /api/v1/productos:
    get:
      tags: [Productos]
      summary: Listar productos
      parameters:
        - name: categoria
          in: query
          required: false
          schema:
            type: string
            example: Calzado
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
  /api/v1/productos/{id}:
    get:
      tags: [Productos]
      summary: Obtener un producto
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          description: Producto no encontrado
  /api/v1/pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [pendiente, pagado, enviado, cancelado]
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '400':
          description: Estado inválido
    post:
      tags: [Pedidos]
      summary: Crear un pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoPedido'
      responses:
        '201':
          description: Pedido registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoCreado'
        '400':
          description: Datos inválidos
        '422':
          description: Producto inexistente o stock insuficiente
  /api/v1/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Obtener el detalle de un pedido
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoDetalle'
        '400':
          $ref: '#/components/responses/IdInvalido'
        '404':
          description: Pedido no encontrado
    patch:
      tags: [Pedidos]
      summary: Cambiar el estado de un pedido
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstado'
      responses:
        '200':
          description: Estado actualizado
        '400':
          description: ID o estado inválido
        '404':
          description: Pedido no encontrado
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    IdInvalido:
      description: El ID debe ser un entero positivo
  schemas:
    Producto:
      type: object
      properties:
        id:
          type: integer
        sku:
          type: string
        nombre:
          type: string
        precio:
          type: number
        stock:
          type: integer
        categoria:
          type: string
          nullable: true
    NuevoPedido:
      type: object
      required: [cliente, items]
      properties:
        cliente:
          type: object
          required: [nombre, correo]
          properties:
            nombre:
              type: string
              maxLength: 120
              example: Ana Pérez
            correo:
              type: string
              format: email
              maxLength: 160
              example: ana@correo.com
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [producto_id, cantidad]
            properties:
              producto_id:
                type: integer
                minimum: 1
                example: 1
              cantidad:
                type: integer
                minimum: 1
                example: 2
    Pedido:
      type: object
      properties:
        id:
          type: integer
        cliente_nombre:
          type: string
        cliente_correo:
          type: string
        estado:
          type: string
          enum: [pendiente, pagado, enviado, cancelado]
        total:
          type: number
        creado_en:
          type: string
          format: date-time
    PedidoCreado:
      allOf:
        - $ref: '#/components/schemas/Pedido'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ItemPedido'
    PedidoDetalle:
      allOf:
        - $ref: '#/components/schemas/Pedido'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ItemPedido'
    ItemPedido:
      type: object
      properties:
        producto_id:
          type: integer
        nombre:
          type: string
        cantidad:
          type: integer
        precio_unitario:
          type: number
    CambioEstado:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum: [pendiente, pagado, enviado, cancelado]
          example: pagado
